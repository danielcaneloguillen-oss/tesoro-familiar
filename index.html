<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Tesoro de Bruno, Carla y Mateo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f7f9fc; margin: 0; padding: 20px; touch-action: manipulation; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; border: 4px solid #ffd700; }
        h1 { color: #2c3e50; font-size: 22px; }
        #cofre { font-size: 100px; margin: 20px 0; display: block; }
        .instruccion { font-size: 20px; color: #34495e; margin-bottom: 20px; min-height: 60px; font-weight: bold; }
        .nombre-niño { color: #e67e22; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .btn { background: #4a90e2; color: white; border: none; padding: 15px 25px; border-radius: 12px; font-size: 18px; cursor: pointer; margin: 10px; }
        .btn-figura { width: 85px; height: 85px; margin: 10px; border: 4px solid #ddd; display: inline-block; }
        input { padding: 12px; font-size: 24px; width: 100px; border-radius: 8px; border: 2px solid #ddd; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>🏆 El Tesoro de la Familia</h1>
    <div id="pantalla-juego">
        <div id="cofre">🔒</div>
        <p id="mensaje-turno" class="instruccion">¿Estáis listos para el reto?</p>
        
        <div id="area-retos">
            <button id="btn-inicio" class="btn" onclick="iniciarJuego()">¡Empezar Aventura!</button>
        </div>
    </div>
</div>

<script>
    let fase = 0;
    let solucionActual = 0;

    function iniciarJuego() {
        fase = 0;
        document.getElementById('cofre').innerText = "🔒";
        cargarReto();
    }

    function cargarReto() {
        const area = document.getElementById('area-retos');
        const mensaje = document.getElementById('mensaje-turno');
        area.innerHTML = '';

        if (fase === 0) {
            // TURNO BRUNO (4 años)
            mensaje.innerHTML = `<span class="nombre-niño">Turno de BRUNO</span> Toca el CÍRCULO ROJO`;
            area.innerHTML = `
                <div style="display: flex; justify-content: center;">
                    <div class="btn-figura" style="background: blue; border-radius: 50%;" onclick="error()"></div>
                    <div class="btn-figura" style="background: red; border-radius: 50%;" onclick="siguienteFase()"></div>
                    <div class="btn-figura" style="background: red;" onclick="error()"></div>
                </div>
            `;
        } else if (fase === 1) {
            // TURNO CARLA (9 años)
            let n1 = Math.floor(Math.random() * 40) + 10;
            let n2 = Math.floor(Math.random() * 30) + 5;
            solucionActual = n1 + n2;
            mensaje.innerHTML = `<span class="nombre-niño">Turno de CARLA</span> ¿Cuánto es ${n1} + ${n2}?`;
            area.innerHTML = `
                <input type="number" id="inputResp" pattern="[0-9]*" inputmode="numeric">
                <br><button class="btn" onclick="validarRespuesta()">Comprobar</button>
            `;
        } else if (fase === 2) {
            // TURNO MATEO (11 años)
            let m1 = Math.floor(Math.random() * 12) + 2;
            let m2 = Math.floor(Math.random() * 9) + 2;
            solucionActual = m1 * m2;
            mensaje.innerHTML = `<span class="nombre-niño">Turno de MATEO</span> ¿Cuánto es ${m1} x ${m2}?`;
            area.innerHTML = `
                <input type="number" id="inputResp" pattern="[0-9]*" inputmode="numeric">
                <br><button class="btn" onclick="validarRespuesta()">Abrir Cofre</button>
            `;
        }
    }

    function validarRespuesta() {
        const r = document.getElementById('inputResp').value;
        if (parseInt(r) === solucionActual) {
            siguienteFase();
        } else {
            alert("¡Casi! Repasad el cálculo en equipo.");
        }
    }

    function siguienteFase() {
        fase++;
        if (fase < 3) {
            alert("¡Muy bien! ¡Siguiente cerradura!");
            cargarReto();
        } else {
            ganar();
        }
    }

    function error() {
        alert("¡Casi, Bruno! Busca el que es redondito y rojo.");
    }

    function ganar() {
        document.getElementById('mensaje-turno').innerHTML = "¡LO HABÉIS LOGRADO!";
        document.getElementById('cofre').innerText = "🔓";
        document.getElementById('area-retos').innerHTML = `
            <h2 style="color: #27ae60;">¡El tesoro es vuestro! 💰</h2>
            <p>Bruno, Carla y Mateo son un gran equipo.</p>
            <button class="btn" onclick="iniciarJuego()">Jugar de nuevo</button>
        `;
    }
</script>

</body>
</html>
