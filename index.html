<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesoro Familiar 🏆</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f0f7ff; margin: 0; padding: 20px; touch-action: manipulation; }
        .card { background: white; border-radius: 25px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); max-width: 450px; margin: auto; border: 5px solid #ffd700; position: relative; }
        #crono { font-size: 18px; color: #e74c3c; font-weight: bold; background: #ffebeb; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
        #cofre { font-size: 90px; margin: 15px 0; display: block; transition: all 0.5s; }
        .nombre-niño { color: #e67e22; font-size: 24px; text-transform: uppercase; display: block; margin-bottom: 8px; border-bottom: 2px solid #eee; }
        .instruccion { font-size: 19px; min-height: 70px; font-weight: bold; }
        .btn { background: #4a90e2; color: white; border: none; padding: 15px 25px; border-radius: 15px; font-size: 18px; cursor: pointer; margin: 10px; }
        .btn-opcion { min-width: 80px; min-height: 80px; margin: 8px; border: 4px solid #ddd; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; border-radius: 15px; }
        input { padding: 12px; font-size: 26px; width: 110px; border-radius: 10px; border: 3px solid #cbd5e0; text-align: center; }
        .record { font-size: 14px; color: #27ae60; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div id="crono">Tiempo: 00:00</div>
    <div id="pantalla-juego">
        <div id="cofre">🔒</div>
        <p id="mensaje-turno" class="instruccion">¿Listos para batir el récord?</p>
        <div id="area-retos">
            <button class="btn" onclick="iniciarJuego()">¡Empezar Misión!</button>
        </div>
    </div>
    <div id="mejor-tiempo" class="record"></div>
</div>

<script>
    let hijoActual = 0, preguntaActual = 1, solucionCorrecta = null;
    let tiempoInicio, intervaloCrono;

    function iniciarJuego() {
        hijoActual = 0; preguntaActual = 1;
        document.getElementById('cofre').innerText = "🔒";
        document.getElementById('cofre').style.transform = "scale(1)";
        
        // Iniciar cronómetro
        tiempoInicio = Date.now();
        clearInterval(intervaloCrono);
        intervaloCrono = setInterval(actualizarCrono, 1000);
        
        cargarReto();
    }

    function actualizarCrono() {
        let segs = Math.floor((Date.now() - tiempoInicio) / 1000);
        let m = Math.floor(segs / 60).toString().padStart(2, '0');
        let s = (segs % 60).toString().padStart(2, '0');
        document.getElementById('crono').innerText = `Tiempo: ${m}:${s}`;
    }

    function cargarReto() {
        const area = document.getElementById('area-retos');
        const mensaje = document.getElementById('mensaje-turno');
        area.innerHTML = '';
